<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Salary Manager Pro</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>💰 Salary Manager Pro</h1>

<div class="card">

<label>Bulan</label>

<select id="filterBulan">

<option value="2026-07">Juli 2026</option>

<option value="2026-08">Agustus 2026</option>

<option value="2026-09">September 2026</option>

<option value="2026-10">Oktober 2026</option>

<option value="2026-11">November 2026</option>

<option value="2026-12">Desember 2026</option>

</select>

</div>

<div class="grid">

<div class="card total">

<h3>💰 Gaji</h3>

<h2 id="totalGaji">Rp0</h2>

</div>

<div class="card total">

<h3>🕒 Lembur</h3>

<h2 id="totalLembur">Rp0</h2>

</div>

<div class="card total">

<h3>💸 Pengeluaran</h3>

<h2 id="totalKeluar">Rp0</h2>

</div>

<div class="card total saldo">

<h3>💵 Saldo</h3>

<h2 id="saldo">Rp0</h2>

</div>

</div>

<div class="menu">

<button onclick="bukaMenu('gaji')">

Tambah Gaji

</button>

<button onclick="bukaMenu('lembur')">

Tambah Lembur

</button>

<button onclick="bukaMenu('keluar')">

Tambah Pengeluaran

</button>

<button onclick="resetSemua()">

Reset Data

</button>

</div>

<div id="formArea">

</div>

<div class="card">

<h2>Riwayat Bulan Ini</h2>

<div id="riwayat">

Belum ada data

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
